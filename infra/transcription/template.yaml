  # Data Freshness Monitoring Lambda IAM Role
  DataFreshnessMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}_${OPCO}_transcription_data_freshness_monitor-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AthenaAndCloudWatchAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource:
                  - !Sub 'arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary'
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/${EventsName}'
              - Effect: Allow
                Action:
                  - lakeformation:GetDataAccess
                # lakeformation:GetDataAccess does not support resource-level permissions (IAM credential-vending
                # action) -- access is actually controlled by the AWS::LakeFormation::Permissions grants elsewhere
                # in this stack, not by this Resource clause.
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::aws-athena-query-results-${AWS::AccountId}-${AWS::Region}'
                  - !Sub 'arn:aws:s3:::aws-athena-query-results-${AWS::AccountId}-${AWS::Region}/*'
                  - !Sub 'arn:aws:s3:::${DataBucketName}'
                  - !Sub 'arn:aws:s3:::${DataBucketName}/*'
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                # cloudwatch:PutMetricData does not support resource-level permissions (AWS-wide limitation);
                # narrowed as far as IAM allows via the cloudwatch:namespace condition below, matching the
                # single namespace this function's Lambda code actually writes to.
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Sub '${Environment}-${OPCO}_TranscriptionPipeline'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: OPCO
          Value: !Ref OPCO

  # Data Freshness Monitoring Lambda Function
  DataFreshnessMonitorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}_${OPCO}_transcription_data_freshness_monitor'
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt DataFreshnessMonitorRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          GLUE_DATABASE: !Ref GlueDatabaseName
          SESSIONS_TABLE: !Sub '${OPCO}_genesys_voice_transcription_sessions'
          UTTERANCES_TABLE: !Sub '${OPCO}_genesys_voice_transcription_utterances'
          ATHENA_OUTPUT_LOCATION: !Sub 's3://aws-athena-query-results-${AWS::AccountId}-${AWS::Region}/data-freshness-checks/'
          OPCO: !Ref OPCO
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import boto3
          import os
          import time
          from datetime import datetime, timezone

          athena = boto3.client('athena')
          cloudwatch = boto3.client('cloudwatch')

          def lambda_handler(event, context):
              database = os.environ['GLUE_DATABASE']
              sessions_table = os.environ['SESSIONS_TABLE']
              utterances_table = os.environ['UTTERANCES_TABLE']
              output_location = os.environ['ATHENA_OUTPUT_LOCATION']
              opco = os.environ['OPCO']
              environment = os.environ['ENVIRONMENT']

              namespace = f'{environment}-{opco}_TranscriptionPipeline'

              # Check sessions table freshness
              sessions_age = check_table_freshness(
                  database, sessions_table, output_location, opco
              )

              # Check utterances table freshness
              utterances_age = check_table_freshness(
                  database, utterances_table, output_location, opco
              )

              # Post custom metrics to CloudWatch
              cloudwatch.put_metric_data(
                  Namespace=namespace,
                  MetricData=[
                      {
                          'MetricName': 'SessionsDataAgeMinutes',
                          'Value': sessions_age,
                          'Unit': 'None',
                          'Timestamp': datetime.now(timezone.utc),
                          'Dimensions': [
                              {'Name': 'TableName', 'Value': 'sessions'},
                              {'Name': 'OPCO', 'Value': opco}
                          ]
                      },
                      {
                          'MetricName': 'UtterancesDataAgeMinutes',
                          'Value': utterances_age,
                          'Unit': 'None',
                          'Timestamp': datetime.now(timezone.utc),
                          'Dimensions': [
                              {'Name': 'TableName', 'Value': 'utterances'},
                              {'Name': 'OPCO', 'Value': opco}
                          ]
                      }
                  ]
              )

              return {
                  'statusCode': 200,
                  'body': {
                      'sessions_age_minutes': sessions_age,
                      'utterances_age_minutes': utterances_age
                  }
              }

          def check_table_freshness(database, table, output_location, opco):
              """Query Athena for max ingest_time and return age in minutes"""

              query = f"""
              SELECT
                  to_iso8601(MAX(COALESCE(
                      from_iso8601_timestamp(event_time),
                      from_iso8601_timestamp(ingest_time)
                  ))) AS max_timestamp
              FROM "{database}"."{table}"
              WHERE opco='{opco}'
                AND dt=CAST(CURRENT_DATE AS VARCHAR)
              """

              # Start query execution
              response = athena.start_query_execution(
                  QueryString=query,
                  QueryExecutionContext={'Database': database},
                  ResultConfiguration={'OutputLocation': output_location}
              )

              query_execution_id = response['QueryExecutionId']

              # Wait for query to complete
              max_attempts = 30
              attempt = 0
              while attempt < max_attempts:
                  result = athena.get_query_execution(QueryExecutionId=query_execution_id)
                  state = result['QueryExecution']['Status']['State']

                  if state == 'SUCCEEDED':
                      break
                  elif state in ['FAILED', 'CANCELLED']:
                      print(f'Query {state}: {result["QueryExecution"]["Status"].get("StateChangeReason", "Unknown")}')
                      return 9999  # Return very high age to trigger alarm

                  time.sleep(2)
                  attempt += 1

              # Get query results
              result = athena.get_query_results(QueryExecutionId=query_execution_id)

              if len(result['ResultSet']['Rows']) < 2:
                  return 9999  # No data found

              max_timestamp_str = result['ResultSet']['Rows'][1]['Data'][0].get('VarCharValue')

              if not max_timestamp_str:
                  return 9999  # NULL timestamp

              # Parse timestamp and calculate age in minutes
              max_timestamp = datetime.fromisoformat(max_timestamp_str.replace('Z', '+00:00'))
              now = datetime.now(timezone.utc)
              age_minutes = (now - max_timestamp).total_seconds() / 60

              return round(age_minutes, 2)
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: OPCO
          Value: !Ref OPCO
        - Key: Purpose
          Value: Monitoring

  # EventBridge Schedule to trigger freshness check every 5 minutes
  DataFreshnessMonitorSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Environment}_${OPCO}_transcription_data_freshness_check'
      Description: 'Check data freshness every 5 minutes'
      ScheduleExpression: 'rate(5 minutes)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt DataFreshnessMonitorLambda.Arn
          Id: DataFreshnessMonitorTarget

  # Lambda Permission for EventBridge to invoke
  DataFreshnessMonitorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DataFreshnessMonitorLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DataFreshnessMonitorSchedule.Arn

  # Data Freshness Alarms (Custom Metrics)
  SessionsDataFreshnessAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: DataFreshnessMonitorLambda
    Properties:
      AlarmName: !Sub '${Environment}-${OPCO}_transcription_sessions_data_freshness'
      AlarmDescription: !Sub 'Sessions data is older than ${DataFreshnessThresholdMinutes} minutes'
      ActionsEnabled: true
      AlarmActions:
        - !If [CreateAlarmFormatter, !Ref SNSAlertTopicArn, !Ref SharedAlarmFormatterTopicArn]
      OKActions:
        - !If [CreateAlarmFormatter, !Ref SNSAlertTopicArn, !Ref SharedAlarmFormatterTopicArn]
      MetricName: SessionsDataAgeMinutes
      Namespace: !Sub '${Environment}-${OPCO}_TranscriptionPipeline'
      Statistic: Maximum
      Dimensions:
        - Name: TableName
          Value: sessions
        - Name: OPCO
          Value: !Ref OPCO
      Period: !Ref DataFreshnessAlarmPeriodSeconds
      EvaluationPeriods: !Ref DataFreshnessAlarmEvaluationPeriods
      Threshold: !Ref DataFreshnessThresholdMinutes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: OPCO
          Value: !Ref OPCO
        - Key: Severity
          Value: Critical

  UtterancesDataFreshnessAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: DataFreshnessMonitorLambda
    Properties:
      AlarmName: !Sub '${Environment}-${OPCO}_transcription_utterances_data_freshness'
      AlarmDescription: !Sub 'Utterances data is older than ${DataFreshnessThresholdMinutes} minutes'
      ActionsEnabled: true
      AlarmActions:
        - !If [CreateAlarmFormatter, !Ref SNSAlertTopicArn, !Ref SharedAlarmFormatterTopicArn]
      OKActions:
        - !If [CreateAlarmFormatter, !Ref SNSAlertTopicArn, !Ref SharedAlarmFormatterTopicArn]
      MetricName: UtterancesDataAgeMinutes
      Namespace: !Sub '${Environment}-${OPCO}_TranscriptionPipeline'
      Statistic: Maximum
      Dimensions:
        - Name: TableName
          Value: utterances
        - Name: OPCO
          Value: !Ref OPCO
      Period: !Ref DataFreshnessAlarmPeriodSeconds
      EvaluationPeriods: !Ref DataFreshnessAlarmEvaluationPeriods
      Threshold: !Ref DataFreshnessThresholdMinutes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: OPCO
          Value: !Ref OPCO
        - Key: Severity
          Value: Critical

# ==========================================
# Outputs
# ==========================================
Outputs:
  LambdaFunctionSessionsArn:
    Description: Lambda function ARN for Sessions stream
    Value: !GetAtt TransformationLambdaSessions.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaSessionsArn'

  LambdaFunctionUtterancesArn:
    Description: Lambda function ARN for Utterances stream
    Value: !GetAtt TransformationLambdaUtterances.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaUtterancesArn'

  LambdaAliasSessionsArn:
    Description: Lambda alias ARN for Sessions (stable)
    Value: !Ref LambdaAliasStableSessions
    Export:
      Name: !Sub '${AWS::StackName}-LambdaAliasSessionsArn'

  LambdaAliasUtterancesArn:
    Description: Lambda alias ARN for Utterances (stable)
    Value: !Ref LambdaAliasStableUtterances
    Export:
      Name: !Sub '${AWS::StackName}-LambdaAliasUtterancesArn'

  FirehoseDeliveryStreamSessionsArn:
    Description: Firehose delivery stream ARN (sessions)
    Value: !GetAtt FirehoseDeliveryStreamSessions.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FirehoseSessionsArn'

  FirehoseDeliveryStreamSessionsName:
    Description: Firehose delivery stream name (sessions)
    Value: !Ref FirehoseDeliveryStreamSessions
    Export:
      Name: !Sub '${AWS::StackName}-FirehoseSessionsName'

  FirehoseDeliveryStreamUtterancesArn:
    Description: Firehose delivery stream ARN (utterances)
    Value: !GetAtt FirehoseDeliveryStreamUtterances.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FirehoseUtterancesArn'

  FirehoseDeliveryStreamUtterancesName:
    Description: Firehose delivery stream name (utterances)
    Value: !Ref FirehoseDeliveryStreamUtterances
    Export:
      Name: !Sub '${AWS::StackName}-FirehoseUtterancesName'

  DLQArn:
    Description: SQS DLQ ARN (shared by both targets)
    Value: !GetAtt EventBridgeDLQ.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DLQArn'

  DLQUrl:
    Description: SQS DLQ URL
    Value: !Ref EventBridgeDLQ
    Export:
      Name: !Sub '${AWS::StackName}-DLQUrl'

  GlueTableSessionsName:
    Description: Glue table name (sessions)
    Value: !Ref GlueTableSessions
    Export:
      Name: !Sub '${AWS::StackName}-GlueTableSessions'

  GlueTableUtterancesName:
    Description: Glue table name (utterances)
    Value: !Ref GlueTableUtterances
    Export:
      Name: !Sub '${AWS::StackName}-GlueTableUtterances'

  EventBridgeRuleArn:
    Description: "ARN of the EventBridge rule"
    Value: !GetAtt EventBridgeRule.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventBridgeRuleArn"

  EventBridgeRuleName:
    Description: "Name of the EventBridge rule"
    Value: !Ref EventBridgeRule
    Export:
      Name: !Sub "${AWS::StackName}-EventBridgeRuleName"

  EventBridgeFirehoseRoleArn:
    Description: "ARN of the EventBridge to Firehose IAM role"
    Value: !GetAtt EventBridgeFirehoseRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventBridgeFirehoseRoleArn"

  DataFreshnessMonitorLambdaArn:
    Description: ARN of the data freshness monitoring Lambda
    Value: !GetAtt DataFreshnessMonitorLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FreshnessMonitor'
