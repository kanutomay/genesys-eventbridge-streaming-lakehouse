AWSTemplateFormatVersion: '2010-09-09'
Description: 'Genesys Voice TRANSCRIPTION Data Pipeline Infrastructure - DUAL OUTPUT (Sessions + Utterances) with CloudWatch Monitoring'

# ==========================================
# Parameters
# ==========================================
Parameters:
  Environment:
    Type: String
    Default: prod
    Description: Environment name
    AllowedValues:
      - dev
      - staging
      - prod

  OPCO:
    Type: String
    Default: ACME
    Description: Operating company code

  OPCOLower:
    Type: String
    Default: acme
    Description: Operating company code in lowercase

  ProjectName:
    Type: String
    Default: genesys_reports
    Description: Project name for resource naming

  LambdaCodeS3Bucket:
    Type: String
    Description: >-
      REQUIRED -- S3 bucket containing this pipeline's Lambda deployment package.
      No default: this is an account-specific bucket you must create/own, not a shared or public one.
    AllowedPattern: '.+'
    ConstraintDescription: 'must be a non-empty S3 bucket name you control'

  LambdaCodeS3Key:
    Type: String
    Default: genesys_voice_interactions/prod/transcription/voice_transcription_transformation_v1.0.1.zip
    Description: S3 key for Lambda code zip file

  S3BasePrefix:
    Type: String
    Default: genesys_voice_interactions
    Description: Base S3 prefix for data storage

  EventsName:
    Type: String
    Default: voice_transcription
    Description: EventBridge rule name base

  GenesysEventBusName:
    Type: String
    Default: aws.partner/genesys.com/cloud/00000000-0000-0000-0000-000000000000/genesys_acme
    Description: Genesys partner event bus name

  DataBucketName:
    Type: String
    Description: >-
      REQUIRED -- S3 bucket for this pipeline's data storage (raw/transformed/error prefixes).
      No default: this is an account-specific bucket you must create/own, not a shared or public one.
    AllowedPattern: '.+'
    ConstraintDescription: 'must be a non-empty S3 bucket name you control'

  GlueDatabaseName:
    Type: String
    Default: genesys_streaming_lakehouse
    Description: Glue database name (raw ingestion — the deduplicated curated view for this table lives in the separate genesys_streaming_lakehouse_curated database, see sql/views/)

  CreateGlueDatabase:
    Type: String
    Default: 'false'
    Description: Whether to create the Glue database (set to true if it doesn't exist)
    AllowedValues:
      - 'true'
      - 'false'

  DataFreshnessThresholdMinutes:
    Type: Number
    Description: Maximum age of data in minutes before alarming
    Default: 30

  DataFreshnessAlarmPeriodSeconds:
    Type: Number
    Description: Period in seconds for data freshness alarm evaluation
    Default: 300

  DataFreshnessAlarmEvaluationPeriods:
    Type: Number
    Description: Number of periods to evaluate before triggering data freshness alarm
    Default: 4

  LambdaErrorRateThreshold:
    Type: Number
    Description: Lambda error rate threshold percentage (0-100)
    Default: 1
    MinValue: 0
    MaxValue: 100

  SNSAlertTopicArn:
    Type: String
    Description: SNS Topic ARN for alert notifications
    Default: arn:aws:sns:us-east-1:123456789012:genesys-pipeline-alerts

  SharedAlarmFormatterTopicArn:
    Type: String
    Description: SNS Topic ARN of shared alarm formatter (leave empty to create new formatter)
    Default: ''

  DataLakeAdminRoleArn:
    Type: String
    Description: IAM role ARN granted DESCRIBE/SELECT on the staging table (e.g. a platform admin role)
    Default: 'arn:aws:iam::123456789012:role/YOUR-LAKE-FORMATION-ADMIN-ROLE'

  DataLakeWorkloadRoleArn:
    Type: String
    Description: IAM role ARN granted DESCRIBE/SELECT on the staging table (e.g. an analytics workload role)
    Default: 'arn:aws:iam::123456789012:role/YOUR-LAKE-FORMATION-WORKLOAD-ROLE'

  DLQKmsKeyArn:
    Type: String
    Description: >-
      Optional customer-managed KMS key ARN for the dead-letter queue's server-side encryption.
      Leave empty to use SQS-managed encryption (SSE-SQS, AWS-owned key) instead -- enabled by
      default below.
    Default: ''

Conditions:
  UseCustomerManagedKmsForDLQ: !Not [!Equals [!Ref DLQKmsKeyArn, '']]
  ShouldCreateGlueDatabase: !Equals [!Ref CreateGlueDatabase, 'true']
  CreateAlarmFormatter: !Equals [!Ref SharedAlarmFormatterTopicArn, '']

# ==========================================
# Resources
# ==========================================
Resources:
  # ============================================================================
  # SQS Dead-Letter Queue
  # ============================================================================
  EventBridgeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Environment}-${EventsName}-dlq'
      MessageRetentionPeriod: 345600  # 4 days
      VisibilityTimeout: 300  # 5 minutes
      SqsManagedSseEnabled: !If [UseCustomerManagedKmsForDLQ, !Ref 'AWS::NoValue', true]
      KmsMasterKeyId: !If [UseCustomerManagedKmsForDLQ, !Ref DLQKmsKeyArn, !Ref 'AWS::NoValue']
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  DLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EventBridgeDLQ
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventBridgeDLQ.Arn

  # ============================================================================
  # Lambda Execution Roles (Separate for Sessions and Utterances)
  # ============================================================================
  LambdaExecutionRoleSessions:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}_${EventsName}_transformation_sessions'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Environment}_${EventsName}_transformation_sessions:*'
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  LambdaExecutionRoleUtterances:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}_${EventsName}_transformation_utterances'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Environment}_${EventsName}_transformation_utterances:*'
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  # ============================================================================
  # Lambda Functions (Separate for Sessions and Utterances streams)
  # ============================================================================
  TransformationLambdaSessions:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}_${EventsName}_transformation_sessions'
      Description: Transform Genesys transcription events for Sessions table
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRoleSessions.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: 512
      Timeout: 60
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          OPCO: !Ref OPCO
          ENVIRONMENT: !Ref Environment
          ENABLE_DEBUG: '0'
          OUTPUT_TYPE: 'sessions'
      TracingConfig:
        Mode: Active
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName
        - Key: output_type
          Value: sessions

  TransformationLambdaUtterances:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}_${EventsName}_transformation_utterances'
      Description: Transform Genesys transcription events for Utterances table
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRoleUtterances.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: 512
      Timeout: 60
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          OPCO: !Ref OPCO
          ENVIRONMENT: !Ref Environment
          ENABLE_DEBUG: '0'
          OUTPUT_TYPE: 'utterances'
      TracingConfig:
        Mode: Active
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName
        - Key: output_type
          Value: utterances

  # Lambda Aliases
  LambdaAliasStableSessions:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref TransformationLambdaSessions
      FunctionVersion: $LATEST
      Name: stable
      Description: Stable version for Sessions Firehose

  LambdaAliasStableUtterances:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref TransformationLambdaUtterances
      FunctionVersion: $LATEST
      Name: stable
      Description: Stable version for Utterances Firehose

  # Lambda Log Groups (explicit creation for retention)
  LambdaLogGroupSessions:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Environment}_${EventsName}_transformation_sessions'
      RetentionInDays: 30

  LambdaLogGroupUtterances:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Environment}_${EventsName}_transformation_utterances'
      RetentionInDays: 30

  # Lambda Invoke Permission for Sessions Firehose
  LambdaInvokePermissionSessions:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TransformationLambdaSessions
      Action: lambda:InvokeFunction
      Principal: firehose.amazonaws.com
      SourceArn: !GetAtt FirehoseDeliveryStreamSessions.Arn

  # Lambda Invoke Permission for Utterances Firehose
  LambdaInvokePermissionUtterances:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TransformationLambdaUtterances
      Action: lambda:InvokeFunction
      Principal: firehose.amazonaws.com
      SourceArn: !GetAtt FirehoseDeliveryStreamUtterances.Arn

  # ============================================================================
  # Firehose Service Role (SHARED by both streams)
  # ============================================================================
  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'KinesisFirehoseServiceRole-${Environment}-${EventsName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref AWS::AccountId
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::${DataBucketName}'
                  - !Sub 'arn:aws:s3:::${DataBucketName}/*'
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !GetAtt TransformationLambdaSessions.Arn
                  - !Sub '${TransformationLambdaSessions.Arn}:*'
                  - !GetAtt TransformationLambdaUtterances.Arn
                  - !Sub '${TransformationLambdaUtterances.Arn}:*'
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                  - glue:GetDatabase
                  - glue:GetPartition
                  - glue:GetPartitions
                  - glue:CreatePartition
                  - glue:BatchCreatePartition
                  - glue:UpdatePartition
                  - glue:BatchUpdatePartition
                  - glue:DeletePartition
                  - glue:BatchDeletePartition
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/*'
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt FirehoseLogGroupSessions.Arn
                  - !GetAtt FirehoseLogGroupUtterances.Arn
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  # ============================================================================
  # Glue Database (Conditional)
  # ============================================================================
  GlueDatabase:
    Type: AWS::Glue::Database
    Condition: ShouldCreateGlueDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: EventBridge staging database for Genesys events

  # ============================================================================
  # Glue Table - SESSIONS
  # ============================================================================
  GlueTableSessions:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabaseName
      TableInput:
        Name: !Sub '${EventsName}_sessions'
        Description: Genesys voice transcription session metadata
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: 'true'
          projection.opco.type: enum
          projection.opco.values: !Ref OPCO
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: 2024-01-01,NOW
          storage.location.template: !Sub 's3://${DataBucketName}/${S3BasePrefix}/${Environment}/transcription/sessions/transformed/opco=${!opco}/dt=${!dt}/'
        StorageDescriptor:
          Columns:
            # Metadata
            - Name: event_id
              Type: string
              Comment: Unique event identifier from EventBridge
            - Name: event_time
              Type: string
              Comment: Event occurrence time (ISO 8601)
            - Name: ingest_time
              Type: string
              Comment: S3 write time from Firehose (ISO 8601)
            - Name: conversation_id
              Type: string
              Comment: Conversation identifier (primary join key to other event tables)
            - Name: interaction_id
              Type: string
              Comment: Interaction identifier (legacy)
            - Name: communication_id
              Type: string
              Comment: Communication channel identifier within the conversation
            # EventBridge envelope
            - Name: eb_version
              Type: string
              Comment: EventBridge event version
            - Name: eb_account
              Type: string
              Comment: AWS Account ID
            - Name: eb_region
              Type: string
              Comment: AWS Region
            - Name: eb_source
              Type: string
              Comment: Event source
            - Name: eb_detail_type
              Type: string
              Comment: EventBridge detail type
            - Name: eb_time
              Type: string
              Comment: EventBridge event time (ISO 8601)
            - Name: topic_name
              Type: string
              Comment: Genesys topic name
            - Name: topic_version
              Type: string
              Comment: Genesys topic version
            - Name: correlation_id
              Type: string
              Comment: Genesys correlation identifier
            - Name: genesys_timestamp
              Type: string
              Comment: Genesys event timestamp (ISO 8601)
            - Name: genesys_event_time
              Type: string
              Comment: Genesys event timestamp (ISO 8601)
            # Core Event Data
            - Name: organization_id
              Type: string
              Comment: Genesys organization identifier
            - Name: session_start_time_ms
              Type: bigint
              Comment: Session start epoch milliseconds
            - Name: transcription_start_time_ms
              Type: bigint
              Comment: Transcription start epoch milliseconds
            - Name: status
              Type: string
              Comment: SESSION_ONGOING or SESSION_ENDED
            - Name: status_offset_ms
              Type: bigint
              Comment: Milliseconds from session start
            - Name: is_session_ended
              Type: boolean
              Comment: True if status is SESSION_ENDED (optimized for queries)
            - Name: is_session_ongoing
              Type: boolean
              Comment: True if status is SESSION_ONGOING (optimized for queries)
            - Name: has_transcripts
              Type: boolean
              Comment: Whether this event contains transcripts
            - Name: num_transcripts
              Type: int
              Comment: Number of utterances in this event
            - Name: raw_event
              Type: string
              Comment: Full original EventBridge event as JSON
          Location: !Sub 's3://${DataBucketName}/${S3BasePrefix}/${Environment}/transcription/sessions/transformed/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          StoredAsSubDirectories: false
        PartitionKeys:
          - Name: opco
            Type: string
            Comment: Operating company code (PANAMA, TRI, FLOW, etc.)
          - Name: dt
            Type: string
            Comment: Event date in UTC timezone (YYYY-MM-DD format)

  # ============================================================================
  # Glue Table - UTTERANCES
  # ============================================================================
  GlueTableUtterances:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabaseName
      TableInput:
        Name: !Sub '${EventsName}_utterances'
        Description: Genesys voice transcription utterances (transcripts stored as array)
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          projection.enabled: 'true'
          projection.opco.type: enum
          projection.opco.values: !Ref OPCO
          projection.dt.type: date
          projection.dt.format: yyyy-MM-dd
          projection.dt.range: 2024-01-01,NOW
          storage.location.template: !Sub 's3://${DataBucketName}/${S3BasePrefix}/${Environment}/transcription/utterances/transformed/opco=${!opco}/dt=${!dt}/'
        StorageDescriptor:
          Columns:
            # Join Keys
            - Name: conversation_id
              Type: string
              Comment: Conversation identifier (primary join key to other event tables)
            - Name: interaction_id
              Type: string
              Comment: Interaction identifier (legacy)
            - Name: communication_id
              Type: string
              Comment: Communication channel identifier within the conversation
            # Metadata
            - Name: event_id
              Type: string
              Comment: Unique event identifier from EventBridge
            - Name: event_time
              Type: string
              Comment: Event occurrence time (ISO 8601)
            - Name: ingest_time
              Type: string
              Comment: S3 write time from Firehose (ISO 8601)
            - Name: num_transcripts
              Type: int
              Comment: Total number of utterances in this event
            # Transcripts stored as JSON string (Firehose can't handle array<struct<>> properly)
            - Name: transcripts
              Type: string
              Comment: JSON array of utterances (parse with json_extract/json_parse in views)
          Location: !Sub 's3://${DataBucketName}/${S3BasePrefix}/${Environment}/transcription/utterances/transformed/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          StoredAsSubDirectories: false
        PartitionKeys:
          - Name: opco
            Type: string
            Comment: Operating company code (PANAMA, TRI, FLOW, etc.)
          - Name: dt
            Type: string
            Comment: Event date in UTC timezone (YYYY-MM-DD format)

  # ============================================================================
  # CloudWatch Log Groups for Firehose
  # ============================================================================
  FirehoseLogGroupSessions:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/kinesisfirehose/${Environment}-${EventsName}-sessions'
      RetentionInDays: 30

  FirehoseLogGroupUtterances:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/kinesisfirehose/${Environment}-${EventsName}-utterances'
      RetentionInDays: 30

  # ============================================================================
  # Firehose Delivery Stream - SESSIONS
  # ============================================================================
  FirehoseDeliveryStreamSessions:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn:
      - LambdaAliasStableSessions
      - FirehoseRole
      - FirehoseLogGroupSessions
      - GlueTableSessions
      - LakeFormationPermsOnSessionsTable
    Properties:
      DeliveryStreamName: !Sub '${Environment}-${EventsName}-sessions'
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !Sub 'arn:aws:s3:::${DataBucketName}'
        RoleARN: !GetAtt FirehoseRole.Arn
        Prefix: !Sub "${S3BasePrefix}/${Environment}/transcription/sessions/transformed/opco=!{partitionKeyFromQuery:opco}/dt=!{partitionKeyFromQuery:dt}/"
        ErrorOutputPrefix: !Sub "${S3BasePrefix}/${Environment}/transcription/sessions/errors/!{firehose:error-output-type}/opco=${OPCO}/dt=!{timestamp:yyyy-MM-dd}/"
        BufferingHints:
          SizeInMBs: 64
          IntervalInSeconds: 60
        CompressionFormat: UNCOMPRESSED
        DynamicPartitioningConfiguration:
          Enabled: true
          RetryOptions:
            DurationInSeconds: 300
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !Ref LambdaAliasStableSessions
                - ParameterName: BufferSizeInMBs
                  ParameterValue: '1'
                - ParameterName: BufferIntervalInSeconds
                  ParameterValue: '60'
            - Type: MetadataExtraction
              Parameters:
                - ParameterName: MetadataExtractionQuery
                  ParameterValue: '{opco:.opco,dt:.dt}'
                - ParameterName: JsonParsingEngine
                  ParameterValue: JQ-1.6
        DataFormatConversionConfiguration:
          SchemaConfiguration:
            DatabaseName: !Ref GlueDatabaseName
            TableName: !Ref GlueTableSessions
            Region: !Ref AWS::Region
            RoleARN: !GetAtt FirehoseRole.Arn
          InputFormatConfiguration:
            Deserializer:
              OpenXJsonSerDe: {}
          OutputFormatConfiguration:
            Serializer:
              ParquetSerDe:
                Compression: SNAPPY
          Enabled: true
        S3BackupMode: Enabled
        S3BackupConfiguration:
          BucketARN: !Sub 'arn:aws:s3:::${DataBucketName}'
          RoleARN: !GetAtt FirehoseRole.Arn
          Prefix: !Sub "${S3BasePrefix}/${Environment}/transcription/sessions/raw/opco=${OPCO}/dt=!{timestamp:yyyy-MM-dd}/"
          ErrorOutputPrefix: !Sub "${S3BasePrefix}/${Environment}/transcription/sessions/errors/!{firehose:error-output-type}/opco=${OPCO}/dt=!{timestamp:yyyy-MM-dd}/"
          BufferingHints:
            SizeInMBs: 5
            IntervalInSeconds: 300
          CompressionFormat: GZIP
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroupSessions
          LogStreamName: S3Delivery
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName
        - Key: stream_type
          Value: sessions

  # ============================================================================
  # Firehose Delivery Stream - UTTERANCES
  # ============================================================================
  FirehoseDeliveryStreamUtterances:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn:
      - LambdaAliasStableUtterances
      - FirehoseRole
      - FirehoseLogGroupUtterances
      - GlueTableUtterances
      - LakeFormationPermsOnUtterancesTable
    Properties:
      DeliveryStreamName: !Sub '${Environment}-${EventsName}-utterances'
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !Sub 'arn:aws:s3:::${DataBucketName}'
        RoleARN: !GetAtt FirehoseRole.Arn
        Prefix: !Sub "${S3BasePrefix}/${Environment}/transcription/utterances/transformed/opco=!{partitionKeyFromQuery:opco}/dt=!{partitionKeyFromQuery:dt}/"
        ErrorOutputPrefix: !Sub "${S3BasePrefix}/${Environment}/transcription/utterances/errors/!{firehose:error-output-type}/opco=${OPCO}/dt=!{timestamp:yyyy-MM-dd}/"
        BufferingHints:
          SizeInMBs: 64
          IntervalInSeconds: 60
        CompressionFormat: UNCOMPRESSED
        DynamicPartitioningConfiguration:
          Enabled: true
          RetryOptions:
            DurationInSeconds: 300
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !Ref LambdaAliasStableUtterances
                - ParameterName: BufferSizeInMBs
                  ParameterValue: '1'
                - ParameterName: BufferIntervalInSeconds
                  ParameterValue: '60'
            - Type: MetadataExtraction
              Parameters:
                - ParameterName: MetadataExtractionQuery
                  ParameterValue: '{opco:.opco,dt:.dt}'
                - ParameterName: JsonParsingEngine
                  ParameterValue: JQ-1.6
        DataFormatConversionConfiguration:
          SchemaConfiguration:
            DatabaseName: !Ref GlueDatabaseName
            TableName: !Ref GlueTableUtterances
            Region: !Ref AWS::Region
            RoleARN: !GetAtt FirehoseRole.Arn
          InputFormatConfiguration:
            Deserializer:
              OpenXJsonSerDe: {}
          OutputFormatConfiguration:
            Serializer:
              ParquetSerDe:
                Compression: SNAPPY
          Enabled: true
        S3BackupMode: Enabled
        S3BackupConfiguration:
          BucketARN: !Sub 'arn:aws:s3:::${DataBucketName}'
          RoleARN: !GetAtt FirehoseRole.Arn
          Prefix: !Sub "${S3BasePrefix}/${Environment}/transcription/utterances/raw/opco=${OPCO}/dt=!{timestamp:yyyy-MM-dd}/"
          ErrorOutputPrefix: !Sub "${S3BasePrefix}/${Environment}/transcription/utterances/errors/!{firehose:error-output-type}/opco=${OPCO}/dt=!{timestamp:yyyy-MM-dd}/"
          BufferingHints:
            SizeInMBs: 5
            IntervalInSeconds: 300
          CompressionFormat: GZIP
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroupUtterances
          LogStreamName: S3Delivery
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName
        - Key: stream_type
          Value: utterances

  # ============================================================================
  # IAM Role for EventBridge to invoke BOTH Firehose Streams
  # ============================================================================
  EventBridgeFirehoseRole:
    Type: AWS::IAM::Role
    DependsOn:
      - FirehoseDeliveryStreamSessions
      - FirehoseDeliveryStreamUtterances
    Properties:
      RoleName: !Sub "EventBridge_Invoke_Firehose_${Environment}-${EventsName}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgeFirehosePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ActionsForBothFirehoseStreams
                Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource:
                  - !GetAtt FirehoseDeliveryStreamSessions.Arn
                  - !GetAtt FirehoseDeliveryStreamUtterances.Arn
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  # ============================================================================
  # EventBridge Rule (Targets BOTH Firehose Streams)
  # ============================================================================
  EventBridgeRule:
    Type: AWS::Events::Rule
    DependsOn:
      - EventBridgeFirehoseRole
      - EventBridgeDLQ
    Properties:
      Name: !Sub "${Environment}-${EventsName}"
      Description: "Genesys voice transcription events to dual Firehose (sessions + utterances)"
      EventBusName: !Ref GenesysEventBusName
      EventPattern:
        source:
          - prefix: "aws.partner/genesys.com"
        detail-type:
          - "v2.conversations.{id}.transcription"
      State: ENABLED
      Targets:
        # Target 1: Sessions Firehose
        - Id: !Sub "${Environment}-${EventsName}-sessions-target"
          Arn: !GetAtt FirehoseDeliveryStreamSessions.Arn
          RoleArn: !GetAtt EventBridgeFirehoseRole.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeDLQ.Arn
        # Target 2: Utterances Firehose
        - Id: !Sub "${Environment}-${EventsName}-utterances-target"
          Arn: !GetAtt FirehoseDeliveryStreamUtterances.Arn
          RoleArn: !GetAtt EventBridgeFirehoseRole.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeDLQ.Arn
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  # EventBridge Archive for replay capability
  EventBridgeArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub ${Environment}-${EventsName}-archive
      Description: !Sub Genesys voice transcription events archive for ${Environment}
        - enables transformation replays
      SourceArn: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${GenesysEventBusName}
      EventPattern:
        source:
          - prefix: aws.partner/genesys.com
        detail-type:
          - "v2.conversations.{id}.transcription"
      RetentionDays: 90

