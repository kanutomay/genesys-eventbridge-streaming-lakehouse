AWSTemplateFormatVersion: '2010-09-09'
Description: 'Genesys Voice ACD.END Data Pipeline Infrastructure'

# ==========================================
# Parameters
# ==========================================
Parameters:
  Environment:
    Type: String
    Default: prod
    Description: Environment name
    AllowedValues:
      - dev
      - staging
      - prod

  OPCO:
    Type: String
    Default: ACME
    Description: Operating company code

  OPCOLower:
    Type: String
    Default: acme
    Description: Operating company code in lowercase

  ProjectName:
    Type: String
    Default: genesys_reports
    Description: Project name for resource naming

  LambdaCodeS3Bucket:
    Type: String
    Description: >-
      REQUIRED -- S3 bucket containing this pipeline's Lambda deployment package.
      No default: this is an account-specific bucket you must create/own, not a shared or public one.
    AllowedPattern: '.+'
    ConstraintDescription: 'must be a non-empty S3 bucket name you control'

  LambdaCodeS3Key:
    Type: String
    Default: genesys_voice_interactions/prod/acdend/voice_acd_end_transformation_v1.0.1.zip
    Description: S3 key for Lambda code zip file

  S3BasePrefix:
    Type: String
    Default: genesys_voice_interactions
    Description: Base S3 prefix for data storage

  EventsName:
    Type: String
    Default: voice_acd_end
    Description: EventBridge rule name

  GenesysEventBusName:
    Type: String
    Default: aws.partner/genesys.com/cloud/00000000-0000-0000-0000-000000000000/genesys_acme
    Description: Genesys partner event bus name

  DataBucketName:
    Type: String
    Description: >-
      REQUIRED -- S3 bucket for this pipeline's data storage (raw/transformed/error prefixes).
      No default: this is an account-specific bucket you must create/own, not a shared or public one.
    AllowedPattern: '.+'
    ConstraintDescription: 'must be a non-empty S3 bucket name you control'

  GlueDatabaseName:
    Type: String
    Default: genesys_streaming_lakehouse
    Description: Glue database name (raw ingestion — the deduplicated curated view for this table lives in the separate genesys_streaming_lakehouse_curated database, see sql/views/)

  CreateGlueDatabase:
    Type: String
    Default: 'false'
    Description: Whether to create the Glue database (set to true if it doesn't exist)
    AllowedValues:
      - 'true'
      - 'false'

  DataFreshnessThresholdMinutes:
    Type: Number
    Description: Maximum age of data in minutes before alarming
    Default: 30

  DataFreshnessAlarmPeriodSeconds:
    Type: Number
    Description: Period in seconds for data freshness metric
    Default: 300

  DataFreshnessAlarmEvaluationPeriods:
    Type: Number
    Description: Number of evaluation periods for data freshness alarm
    Default: 4

  LambdaErrorRateThreshold:
    Type: Number
    Description: Lambda error rate threshold percentage (0-100)
    Default: 1
    MinValue: 0
    MaxValue: 100

  SNSAlertTopicArn:
    Type: String
    Description: SNS Topic ARN for alert notifications
    Default: arn:aws:sns:us-east-1:123456789012:genesys-pipeline-alerts

  SharedAlarmFormatterTopicArn:
    Type: String
    Description: ARN of shared alarm formatter SNS topic (leave empty to create new)
    Default: ''

  DataLakeAdminRoleArn:
    Type: String
    Description: IAM role ARN granted DESCRIBE/SELECT on the staging table (e.g. a platform admin role)
    Default: 'arn:aws:iam::123456789012:role/YOUR-LAKE-FORMATION-ADMIN-ROLE'

  DataLakeWorkloadRoleArn:
    Type: String
    Description: IAM role ARN granted DESCRIBE/SELECT on the staging table (e.g. an analytics workload role)
    Default: 'arn:aws:iam::123456789012:role/YOUR-LAKE-FORMATION-WORKLOAD-ROLE'

  DLQKmsKeyArn:
    Type: String
    Description: >-
      Optional customer-managed KMS key ARN for the dead-letter queue's server-side encryption.
      Leave empty to use SQS-managed encryption (SSE-SQS, AWS-owned key) instead -- enabled by
      default below.
    Default: ''

Conditions:
  UseCustomerManagedKmsForDLQ: !Not [!Equals [!Ref DLQKmsKeyArn, '']]
  ShouldCreateGlueDatabase: !Equals [!Ref CreateGlueDatabase, 'true']
  CreateAlarmFormatter: !Equals [!Ref SharedAlarmFormatterTopicArn, '']

# ==========================================
# Resources
# ==========================================
Resources:
  # ============================================================================
  # SQS Dead-Letter Queue
  # ============================================================================
  EventBridgeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Environment}-${EventsName}-dlq'
      MessageRetentionPeriod: 345600  # 4 days
      VisibilityTimeout: 300  # 5 minutes
      SqsManagedSseEnabled: !If [UseCustomerManagedKmsForDLQ, !Ref 'AWS::NoValue', true]
      KmsMasterKeyId: !If [UseCustomerManagedKmsForDLQ, !Ref DLQKmsKeyArn, !Ref 'AWS::NoValue']
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  # ============================================================================
  # Shared Alarm Formatter (created once, reused by all pipelines)
  # ============================================================================
  AlarmFormatterLambda:
    Type: AWS::Lambda::Function
    Condition: CreateAlarmFormatter
    Properties:
      FunctionName: !Sub '${Environment}-${OPCOLower}-genesys-shared-alarm-formatter'
      Description: Formats CloudWatch alarm notifications with custom subjects for all Genesys pipelines
      Runtime: python3.11
      Handler: index.lambda_handler
      Timeout: 30
      Role: !GetAtt AlarmFormatterRole.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          sns = boto3.client('sns')
          TARGET_SNS_ARN = os.environ['TARGET_SNS_ARN']

          def lambda_handler(event, context):
              try:
                  message = json.loads(event['Records'][0]['Sns']['Message'])
                  alarm_name = message.get('AlarmName', 'Unknown')
                  new_state = message.get('NewStateValue', 'UNKNOWN')
                  reason = message.get('NewStateReason', '')

                  # Extract pipeline name from alarm
                  pipeline = 'Pipeline'
                  if 'userend' in alarm_name.lower():
                      pipeline = 'Userend'
                  elif 'customerend' in alarm_name.lower():
                      pipeline = 'CustomerEnd'
                  elif 'attributes' in alarm_name.lower():
                      pipeline = 'Attributes'
                  elif 'acdend' in alarm_name.lower():
                      pipeline = 'ACDEnd'
                  elif 'flowend' in alarm_name.lower():
                      pipeline = 'FlowEnd'
                  elif 'flowoutcome' in alarm_name.lower():
                      pipeline = 'FlowOutcome'
                  elif 'transcription_sessions' in alarm_name.lower():
                      pipeline = 'Transcription Sessions'
                  elif 'transcription_utterances' in alarm_name.lower():
                      pipeline = 'Transcription Utterances'

                  # Custom subject based on alarm type and state
                  if new_state == 'ALARM':
                      if 'data_freshness' in alarm_name.lower():
                          icon = '🚨'
                          alarm_type = 'Data Freshness'
                      elif 'error_rate' in alarm_name.lower():
                          icon = '⚠️'
                          alarm_type = 'Error Rate'
                      elif 'error' in alarm_name.lower():
                          icon = '⚠️'
                          alarm_type = 'Errors'
                      elif 'dlq' in alarm_name.lower():
                          icon = '💀'
                          alarm_type = 'DLQ Messages'
                      elif 'duration' in alarm_name.lower():
                          icon = '⏱️'
                          alarm_type = 'Duration'
                      else:
                          icon = '⚠️'
                          alarm_type = 'Alert'
                      subject = f"{icon} Genesys {pipeline}: {alarm_type} ALARM"
                  elif new_state == 'OK':
                      subject = f"✅ Genesys {pipeline}: Recovered"
                  else:
                      subject = f"❓ Genesys {pipeline}: {new_state}"

                  # Create formatted message
                  formatted_message = (
                      f"ALARM: {alarm_name}\n"
                      f"STATE: {new_state}\n"
                      f"PIPELINE: {pipeline}\n"
                      f"REASON: {reason}\n\n"
                      f"========================================\n"
                      f"Full Details:\n"
                      f"{json.dumps(message, indent=2)}"
                  )

                  # Publish with custom subject
                  sns.publish(
                      TopicArn=TARGET_SNS_ARN,
                      Subject=subject[:100],  # SNS subject limit
                      Message=formatted_message
                  )

                  return {'statusCode': 200, 'body': 'Notification sent'}

              except Exception as e:
                  print(f"Error formatting alarm: {str(e)}")
                  # Forward original message on error
                  sns.publish(
                      TopicArn=TARGET_SNS_ARN,
                      Subject='Genesys Alert (formatter error)',
                      Message=json.dumps(event, indent=2)
                  )
                  raise
      Environment:
        Variables:
          TARGET_SNS_ARN: !Ref SNSAlertTopicArn
      Tags:
        - Key: Name
          Value: genesys-shared-alarm-formatter
        - Key: Purpose
          Value: Shared alarm message formatting

  AlarmFormatterRole:
    Type: AWS::IAM::Role
    Condition: CreateAlarmFormatter
    Properties:
      RoleName: !Sub '${Environment}-${OPCOLower}-genesys-shared-alarm-formatter-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SNSAlertTopicArn

  AlarmFormatterLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateAlarmFormatter
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Environment}-${OPCOLower}-genesys-shared-alarm-formatter'
      RetentionInDays: 7

  AlarmFormatterSNSTopic:
    Type: AWS::SNS::Topic
    Condition: CreateAlarmFormatter
    Properties:
      TopicName: !Sub '${Environment}-${OPCOLower}-genesys-shared-alarm-formatter-topic'
      DisplayName: !Sub 'Genesys ${OPCO} Alarm Formatter'
      Subscription:
        - Endpoint: !GetAtt AlarmFormatterLambda.Arn
          Protocol: lambda

  AlarmFormatterInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateAlarmFormatter
    Properties:
      FunctionName: !Ref AlarmFormatterLambda
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlarmFormatterSNSTopic

  DLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EventBridgeDLQ
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventBridgeDLQ.Arn

  # ============================================================================
  # Lambda Execution Role
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}_${EventsName}_transformation'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Environment}_${EventsName}_transformation:*'
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  # ============================================================================
  # Lambda Function
  # ============================================================================
  TransformationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}_${EventsName}_transformation'
      Description: Transform Genesys acd end events for Firehose ingestion
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: 128
      Timeout: 30
      #ReservedConcurrentExecutions: 8
      Environment:
        Variables:
          OPCO: !Ref OPCO
          ENVIRONMENT: !Ref Environment
          ENABLE_DEBUG: '0'
      TracingConfig:
        Mode: Active
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  # Lambda Alias
  LambdaAliasStable:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref TransformationLambda
      FunctionVersion: $LATEST
      Name: stable
      Description: Stable version for Firehose

  # Lambda Log Group (explicit creation for retention)
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Environment}_${EventsName}_transformation'
      RetentionInDays: 30

  # Lambda Invoke Permission for Firehose
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TransformationLambda
      Action: lambda:InvokeFunction
      Principal: firehose.amazonaws.com
      SourceArn: !GetAtt FirehoseDeliveryStream.Arn

  # ============================================================================
  # Firehose Service Role
  # ============================================================================
  FirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'KinesisFirehoseServiceRole-${Environment}-${EventsName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref AWS::AccountId
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::${DataBucketName}'
                  - !Sub 'arn:aws:s3:::${DataBucketName}/*'
        - PolicyName: LambdaInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !GetAtt TransformationLambda.Arn
                  - !Sub '${TransformationLambda.Arn}:*'
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetTableVersion
                  - glue:GetTableVersions
                  - glue:GetDatabase
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/${EventsName}'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/kinesisfirehose/*'
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  # ============================================================================
  # Glue Database (Conditional)
  # ============================================================================
  GlueDatabase:
    Type: AWS::Glue::Database
    Condition: ShouldCreateGlueDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: Staging for Genesys EventBridge events (not shared)

  # ============================================================================
  # Glue Table
  # ============================================================================
  GlueTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabaseName
      TableInput:
        Name: !Ref EventsName
        Description: Genesys voice interaction acd end - staging table with full event history
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          parquet.compression: SNAPPY
          projection.enabled: 'true'
          projection.opco.type: enum
          projection.opco.values: ACME
          projection.dt.type: date
          projection.dt.range: '2024-01-01,NOW'
          projection.dt.format: yyyy-MM-dd
          storage.location.template: !Sub 's3://${DataBucketName}/genesys_voice_interactions/${Environment}/acdend/transformed/opco=${!opco}/dt=${!dt}/'
        StorageDescriptor:
          Location: !Sub 's3://${DataBucketName}/genesys_voice_interactions/${Environment}/acdend/transformed/'
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
          Columns:
            # Metadata
            - Name: event_id
              Type: string
              Comment: Unique event identifier from EventBridge
            - Name: event_time
              Type: string
              Comment: Event occurrence time (ISO 8601)
            - Name: ingest_time
              Type: string
              Comment: S3 write time from Firehose (ISO 8601)
            - Name: conversation_id
              Type: string
              Comment: Conversation identifier
            - Name: interaction_id
              Type: string
              Comment: Interaction identifier (legacy)
            - Name: participant_id
              Type: string
              Comment: Participant identifier
            # EventBridge envelope
            - Name: eb_version
              Type: string
              Comment: EventBridge version
            - Name: eb_account
              Type: string
              Comment: AWS Account ID
            - Name: eb_region
              Type: string
              Comment: AWS Region
            - Name: eb_source
              Type: string
              Comment: Event source
            - Name: eb_detail_type
              Type: string
              Comment: EventBridge detail type
            - Name: eb_time
              Type: string
              Comment: EventBridge event time (ISO 8601)
            - Name: topic_name
              Type: string
              Comment: Genesys topic name
            - Name: topic_version
              Type: string
              Comment: Genesys topic version
            - Name: correlation_id
              Type: string
              Comment: Genesys correlation identifier
            - Name: genesys_timestamp
              Type: string
              Comment: Genesys event timestamp (ISO 8601)
            - Name: genesys_event_time
              Type: bigint
              Comment: Genesys event time (epoch milliseconds)
            # Core Event Data
            - Name: session_id
              Type: string
              Comment: "Session identifier"
            - Name: disconnect_type
              Type: string
              Comment: "How call ended: TRANSFER, PEER, etc."
            - Name: media_type
              Type: string
              Comment: "Always VOICE for this table"
            - Name: provider
              Type: string
              Comment: "Provider (e.g., Edge)"
            - Name: direction
              Type: string
              Comment: "Call direction: INBOUND or OUTBOUND"
            - Name: ani
              Type: string
              Comment: "Caller phone number (format: tel:+...)"
            - Name: dnis
              Type: string
              Comment: "Dialed number (format: tel:+...)"
            - Name: queue_id
              Type: string
              Comment: "Queue that handled the call"
            - Name: division_id
              Type: string
              Comment: "Division identifier"
            - Name: acd_outcome
              Type: string
              Comment: "Outcome: ANSWERED, ABANDON, UNKNOWN, FLOW_OUT"
            - Name: used_routing
              Type: string
              Comment: "Routing method used: STANDARD, MANUAL, etc."
            - Name: routing_priority
              Type: int
              Comment: "Routing priority (0-100)"
            - Name: connected_duration_ms
              Type: bigint
              Comment: "Duration in milliseconds"
            - Name: utilization_label
              Type: string
              Comment: "Utilization label identifier"
            # ===== Optional Fields (NULLABLE) =====
            - Name: answered_user_id
              Type: string
              Comment: "Agent who answered (only when acd_outcome = ANSWERED)"
            - Name: conversation_external_contact_ids
              Type: array<string>
              Comment: "External contact identifiers (present on nearly every conversation, illustrative)"
            - Name: requested_routings
              Type: array<string>
              Comment: "Requested routing methods (present on most conversations, illustrative)"
            - Name: flow_type
              Type: string
              Comment: "Flow type (e.g., inqueuecall) (present on most conversations, illustrative)"
            # ===== Raw Event (Keep full event for flexibility) =====
            - Name: raw_event
              Type: string
              Comment: "Complete raw JSON event"
        PartitionKeys:
          - Name: opco
            Type: string
            Comment: Operating company code
          - Name: dt
            Type: string
            Comment: Partition date (YYYY-MM-DD)

  # ============================================================================
  # Firehose Delivery Stream
  # ============================================================================
  # Firehose Log Group (explicit creation for retention)
  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/kinesisfirehose/${Environment}-${EventsName}"
      RetentionInDays: 14

  # Firehose Delivery Stream
  FirehoseDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn:
      - TransformationLambda
      - LambdaAliasStable
      - GlueTable
      - LakeFormationPermsOnStagingTable
      - FirehoseRole
      - FirehoseLogGroup
    Properties:
      DeliveryStreamName: !Sub '${Environment}-${EventsName}'
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !Sub 'arn:aws:s3:::${DataBucketName}'
        RoleARN: !GetAtt FirehoseRole.Arn
        Prefix: !Sub "${S3BasePrefix}/${Environment}/acdend/transformed/opco=!{partitionKeyFromQuery:opco}/dt=!{partitionKeyFromQuery:dt}/"
        ErrorOutputPrefix: !Sub "${S3BasePrefix}/${Environment}/acdend/errors/!{firehose:error-output-type}/opco=${OPCO}/dt=!{timestamp:yyyy-MM-dd}/"
        BufferingHints:
          SizeInMBs: 128
          IntervalInSeconds: 300
        CompressionFormat: UNCOMPRESSED  # Parquet is already compressed
        DynamicPartitioningConfiguration:
          Enabled: true
          RetryOptions:
            DurationInSeconds: 300
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !Ref LambdaAliasStable
                - ParameterName: BufferSizeInMBs
                  ParameterValue: '1'
                - ParameterName: BufferIntervalInSeconds
                  ParameterValue: '60'
            - Type: MetadataExtraction
              Parameters:
                - ParameterName: MetadataExtractionQuery
                  ParameterValue: '{opco:.opco,dt:.dt}'
                - ParameterName: JsonParsingEngine
                  ParameterValue: JQ-1.6
        DataFormatConversionConfiguration:
          SchemaConfiguration:
            DatabaseName: !Ref GlueDatabaseName
            TableName: !Ref EventsName
            Region: !Ref AWS::Region
            RoleARN: !GetAtt FirehoseRole.Arn
          InputFormatConfiguration:
            Deserializer:
              OpenXJsonSerDe: {}
          OutputFormatConfiguration:
            Serializer:
              ParquetSerDe:
                Compression: SNAPPY
          Enabled: true
        S3BackupMode: Enabled
        S3BackupConfiguration:
          BucketARN: !Sub 'arn:aws:s3:::${DataBucketName}'
          RoleARN: !GetAtt FirehoseRole.Arn
          Prefix: !Sub "${S3BasePrefix}/${Environment}/acdend/raw/opco=${OPCO}/dt=!{timestamp:yyyy-MM-dd}/"
          ErrorOutputPrefix: !Sub "${S3BasePrefix}/${Environment}/acdend/raw-errors/!{firehose:error-output-type}/opco=${OPCO}/dt=!{timestamp:yyyy-MM-dd}/"
          BufferingHints:
            SizeInMBs: 5
            IntervalInSeconds: 300
          CompressionFormat: GZIP
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: S3Delivery
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName


  # ============================================================================
  # IAM Role for EventBridge to invoke Firehose
  # ============================================================================
  EventBridgeFirehoseRole:
    Type: AWS::IAM::Role
    DependsOn: FirehoseDeliveryStream
    Properties:
      RoleName: !Sub "EventBridge_Invoke_Firehose_${Environment}-${EventsName}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgeFirehosePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ActionsForFirehose
                Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !GetAtt FirehoseDeliveryStream.Arn
                #Resource: !Sub "arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/${Environment}-${EventsName}"
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  # ============================================================================
  # EventBridge Rule
  # ============================================================================
  EventBridgeRule:
    Type: AWS::Events::Rule
    DependsOn: [EventBridgeFirehoseRole, EventBridgeDLQ]
    Properties:
      Name: !Sub "${Environment}-${EventsName}"
      Description: "Genesys voice interactions acd end events to Firehose"
      EventBusName: !Ref GenesysEventBusName
      EventPattern:
        source:
          - prefix: "aws.partner/genesys.com"
        detail-type:
          - "v2.detail.events.conversation.{id}.acd.end"
        detail:
          eventBody:
            mediaType:
              - "VOICE"
      State: ENABLED
      Targets:
        - Id: !Sub "${Environment}-${EventsName}-firehose-target"
          Arn: !GetAtt FirehoseDeliveryStream.Arn
          RoleArn: !GetAtt EventBridgeFirehoseRole.Arn
          DeadLetterConfig:
            Arn: !GetAtt EventBridgeDLQ.Arn
      Tags:
        - Key: env
          Value: !Ref Environment
        - Key: opco
          Value: !Ref OPCO
        - Key: project
          Value: !Ref ProjectName

  # EventBridge Archive for replay capability
  EventBridgeArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: !Sub ${Environment}-${EventsName}-archive
      Description: !Sub Genesys voice acd.end events archive for ${Environment}
        - enables transformation replays
      SourceArn: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${GenesysEventBusName}
      EventPattern:
        source:
          - prefix: aws.partner/genesys.com
        detail-type:
          - "v2.detail.events.conversation.{id}.acd.end"
        detail:
          eventBody:
            mediaType:
              - "VOICE"
      RetentionDays: 90

  # ============================================================================
  # Lake Formation Permissions for Kinesis Firehose Role
  # ============================================================================
  LakeFormationPermsOnStagingDB:
    Type: AWS::LakeFormation::Permissions
    DependsOn: [GlueTable, FirehoseRole]
    Properties:
      DataLakePrincipal:
        DataLakePrincipalIdentifier: !GetAtt FirehoseRole.Arn
      Permissions:
        - DESCRIBE
      Resource:
        DatabaseResource:
          CatalogId: !Ref AWS::AccountId
          Name: !Ref GlueDatabaseName

  LakeFormationPermsOnStagingTable:
    Type: AWS::LakeFormation::Permissions
    DependsOn: LakeFormationPermsOnStagingDB
    Properties:
      DataLakePrincipal:
        DataLakePrincipalIdentifier: !GetAtt FirehoseRole.Arn
      Permissions:
        - DESCRIBE
        - SELECT
      Resource:
       TableResource:
          CatalogId: !Ref AWS::AccountId
          DatabaseName: !Ref GlueDatabaseName
          Name: !Ref GlueTable

  # ============================================================================
  # Lake Formation Permissions for additional roles/users
  # ============================================================================
  LakeFormationAdditionalAdminAccess:
    Type: AWS::LakeFormation::Permissions
    DependsOn: [GlueTable, LakeFormationPermsOnStagingDB]
    Properties:
      DataLakePrincipal:
        DataLakePrincipalIdentifier: !Ref DataLakeAdminRoleArn
      Permissions:
        - DESCRIBE
        - SELECT
      Resource:
       TableResource:
          CatalogId: !Ref AWS::AccountId
          DatabaseName: !Ref GlueDatabaseName
          Name: !Ref GlueTable

  LakeFormationAdditionalWorkloadAccess:
    Type: AWS::LakeFormation::Permissions
    DependsOn: [GlueTable, LakeFormationPermsOnStagingDB]
    Properties:
      DataLakePrincipal:
        DataLakePrincipalIdentifier: !Ref DataLakeWorkloadRoleArn
      Permissions:
        - DESCRIBE
        - SELECT
      Resource:
       TableResource:
          CatalogId: !Ref AWS::AccountId
          DatabaseName: !Ref GlueDatabaseName
          Name: !Ref GlueTable

  # ============================================================================
  # CloudWatch Alarms for Monitoring
  # ============================================================================

  # DLQ Depth Alarm
  DLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-${OPCO}_acdend_dlq_depth'
      AlarmDescription: 'Dead Letter Queue has unprocessed failed events'
      ActionsEnabled: true
      AlarmActions:
        - !If [CreateAlarmFormatter, !Ref AlarmFormatterSNSTopic, !Ref SharedAlarmFormatterTopicArn]
      OKActions:
        - !If [CreateAlarmFormatter, !Ref AlarmFormatterSNSTopic, !Ref SharedAlarmFormatterTopicArn]
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Maximum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventBridgeDLQ.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Lambda Error Rate Alarm
  LambdaErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-${OPCO}_acdend_lambda_error_rate'
      AlarmDescription: 'Lambda error rate exceeds threshold'
      ActionsEnabled: true
      AlarmActions:
        - !If [CreateAlarmFormatter, !Ref AlarmFormatterSNSTopic, !Ref SharedAlarmFormatterTopicArn]
      OKActions:
        - !If [CreateAlarmFormatter, !Ref AlarmFormatterSNSTopic, !Ref SharedAlarmFormatterTopicArn]
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Dimensions:
        - Name: FunctionName
          Value: !Ref TransformationLambda
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Lambda Error Percentage Alarm
  LambdaErrorPercentageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-${OPCO}_acdend_lambda_error_percentage'
      AlarmDescription: !Sub 'Lambda error rate exceeds ${LambdaErrorRateThreshold}%'
      ActionsEnabled: true
      AlarmActions:
        - !If [CreateAlarmFormatter, !Ref AlarmFormatterSNSTopic, !Ref SharedAlarmFormatterTopicArn]
      OKActions:
        - !If [CreateAlarmFormatter, !Ref AlarmFormatterSNSTopic, !Ref SharedAlarmFormatterTopicArn]
      Metrics:
        - Id: error_rate
          Expression: '(errors/invocations)*100'
          Label: 'Error Rate %'
        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref TransformationLambda
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref TransformationLambda
            Period: 300
            Stat: Sum
          ReturnData: false
      EvaluationPeriods: 2
      Threshold: !Ref LambdaErrorRateThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Lambda Duration Alarm
  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Environment}-${OPCO}_acdend_lambda_duration'
      AlarmDescription: 'Lambda approaching timeout'
      ActionsEnabled: true
      AlarmActions:
        - !If [CreateAlarmFormatter, !Ref AlarmFormatterSNSTopic, !Ref SharedAlarmFormatterTopicArn]
      OKActions:
        - !If [CreateAlarmFormatter, !Ref AlarmFormatterSNSTopic, !Ref SharedAlarmFormatterTopicArn]
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Maximum
      Dimensions:
        - Name: FunctionName
          Value: !Ref TransformationLambda
      Period: 300
      EvaluationPeriods: 2
      Threshold: 48000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Data Freshness Monitoring Lambda IAM Role
  DataFreshnessMonitorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}_${OPCO}_acdend_data_freshness_monitor-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AthenaAndCloudWatchAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'athena:StartQueryExecution'
                  - 'athena:GetQueryExecution'
                  - 'athena:GetQueryResults'
                Resource:
                  - !Sub 'arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/primary'
              - Effect: Allow
                Action:
                  - 'glue:GetDatabase'
                  - 'glue:GetTable'
                  - 'glue:GetPartitions'
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseName}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseName}/${EventsName}'
              - Effect: Allow
                Action:
                  - 's3:GetBucketLocation'
                  - 's3:GetObject'
                  - 's3:ListBucket'
                  - 's3:PutObject'
                Resource:
                  - 'arn:aws:s3:::aws-athena-query-results-*'
                  - 'arn:aws:s3:::aws-athena-query-results-*/*'
              - Effect: Allow
                Action:
                  - 'cloudwatch:PutMetricData'
                # cloudwatch:PutMetricData does not support resource-level permissions (AWS-wide limitation);
                # narrowed as far as IAM allows via the cloudwatch:namespace condition below, matching the
                # single namespace this function's Lambda code actually writes to.
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Sub '${Environment}-${OPCO}_AcdendPipeline'
              - Effect: Allow
                Action:
                  - 'lakeformation:GetDataAccess'
                # lakeformation:GetDataAccess does not support resource-level permissions (IAM credential-vending
                # action) -- access is actually controlled by the AWS::LakeFormation::Permissions grants elsewhere
                # in this stack, not by this Resource clause.
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Data Freshness Monitoring Lambda Function
  DataFreshnessMonitorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}_${OPCO}_acdend_data_freshness_monitor'
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt DataFreshnessMonitorRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          GLUE_DATABASE: !Ref GlueDatabaseName
          TABLE_NAME: !Ref EventsName
          ATHENA_OUTPUT_LOCATION: !Sub 's3://aws-athena-query-results-${AWS::AccountId}-${AWS::Region}/'
          OPCO: !Ref OPCO
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import boto3
          import os
          import time
          from datetime import datetime, timezone

          athena = boto3.client('athena')
          cloudwatch = boto3.client('cloudwatch')

          def lambda_handler(event, context):
              database = os.environ['GLUE_DATABASE']
              table = os.environ['TABLE_NAME']
              output_location = os.environ['ATHENA_OUTPUT_LOCATION']
              opco = os.environ['OPCO']
              environment = os.environ['ENVIRONMENT']

              query = f"""
              SELECT to_iso8601(MAX(COALESCE(
                  from_iso8601_timestamp(event_time),
                  from_iso8601_timestamp(ingest_time)
              ))) AS max_timestamp
              FROM "{database}"."{table}"
              WHERE opco='{opco}' AND dt=CAST(CURRENT_DATE AS VARCHAR)
              """

              try:
                  response = athena.start_query_execution(
                      QueryString=query,
                      QueryExecutionContext={'Database': database},
                      ResultConfiguration={'OutputLocation': output_location}
                  )

                  query_execution_id = response['QueryExecutionId']

                  # Wait for query to complete
                  max_attempts = 30
                  for attempt in range(max_attempts):
                      status = athena.get_query_execution(QueryExecutionId=query_execution_id)
                      state = status['QueryExecution']['Status']['State']

                      if state in ['SUCCEEDED', 'FAILED', 'CANCELLED']:
                          break
                      time.sleep(2)

                  if state != 'SUCCEEDED':
                      print(f"Query failed with state: {state}")
                      post_metric(environment, opco, 9999)  # Post error value
                      return {'statusCode': 500, 'body': f'Query {state}'}

                  # Get results
                  results = athena.get_query_results(QueryExecutionId=query_execution_id)

                  if len(results['ResultSet']['Rows']) > 1:
                      max_timestamp_str = results['ResultSet']['Rows'][1]['Data'][0].get('VarCharValue')

                      if max_timestamp_str:
                          max_timestamp = datetime.fromisoformat(max_timestamp_str.replace('Z', '+00:00'))
                          now = datetime.now(timezone.utc)
                          age_minutes = (now - max_timestamp).total_seconds() / 60

                          print(f"Latest data timestamp: {max_timestamp_str}, Age: {age_minutes:.2f} minutes")
                          post_metric(environment, opco, age_minutes)

                          return {
                              'statusCode': 200,
                              'body': f'Data age: {age_minutes:.2f} minutes'
                          }

                  print("No data found for today")
                  post_metric(environment, opco, 9999)
                  return {'statusCode': 200, 'body': 'No data for today'}

              except Exception as e:
                  print(f"Error: {str(e)}")
                  post_metric(environment, opco, 9999)
                  return {'statusCode': 500, 'body': str(e)}

          def post_metric(environment, opco, age_minutes):
              cloudwatch.put_metric_data(
                  Namespace=f'{environment}-{opco}_AcdendPipeline',
                  MetricData=[
                      {
                          'MetricName': 'DataAgeMinutes',
                          'Value': age_minutes,
                          'Unit': 'None',
                          'Dimensions': [
                              {'Name': 'TableName', 'Value': 'acdend'},
                              {'Name': 'OPCO', 'Value': opco}
                          ]
                      }
                  ]
              )
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # EventBridge Schedule to trigger freshness check every 5 minutes
  DataFreshnessMonitorSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Environment}_${OPCO}_acdend_data_freshness_check'
      Description: 'Check data freshness every 5 minutes'
      ScheduleExpression: 'rate(5 minutes)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt DataFreshnessMonitorLambda.Arn
          Id: DataFreshnessMonitorTarget

  # Lambda Permission for EventBridge to invoke
  DataFreshnessMonitorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DataFreshnessMonitorLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DataFreshnessMonitorSchedule.Arn

  # Data Freshness Alarm (Custom Metric)
  DataFreshnessAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: DataFreshnessMonitorLambda
    Properties:
      AlarmName: !Sub '${Environment}-${OPCO}_acdend_data_freshness'
      AlarmDescription: !Sub 'Acdend data is older than ${DataFreshnessThresholdMinutes} minutes'
      ActionsEnabled: true
      AlarmActions:
        - !If [CreateAlarmFormatter, !Ref AlarmFormatterSNSTopic, !Ref SharedAlarmFormatterTopicArn]
      OKActions:
        - !If [CreateAlarmFormatter, !Ref AlarmFormatterSNSTopic, !Ref SharedAlarmFormatterTopicArn]
      MetricName: DataAgeMinutes
      Namespace: !Sub '${Environment}-${OPCO}_AcdendPipeline'
      Statistic: Maximum
      Dimensions:
        - Name: TableName
          Value: acdend
        - Name: OPCO
          Value: !Ref OPCO
      Period: !Ref DataFreshnessAlarmPeriodSeconds
      EvaluationPeriods: !Ref DataFreshnessAlarmEvaluationPeriods
      Threshold: !Ref DataFreshnessThresholdMinutes
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # Lake Formation Permissions for Data Freshness Monitor Lambda
  # ============================================================================
  LakeFormationPermsOnDBForMonitor:
    Type: AWS::LakeFormation::Permissions
    DependsOn:
      - GlueTable
      - DataFreshnessMonitorRole
    Properties:
      DataLakePrincipal:
        DataLakePrincipalIdentifier: !GetAtt DataFreshnessMonitorRole.Arn
      Permissions:
        - DESCRIBE
      Resource:
        DatabaseResource:
          CatalogId: !Ref AWS::AccountId
          Name: !Ref GlueDatabaseName

  LakeFormationPermsOnTableForMonitor:
    Type: AWS::LakeFormation::Permissions
    DependsOn: LakeFormationPermsOnDBForMonitor
    Properties:
      DataLakePrincipal:
        DataLakePrincipalIdentifier: !GetAtt DataFreshnessMonitorRole.Arn
      Permissions:
        - DESCRIBE
        - SELECT
      Resource:
        TableResource:
          CatalogId: !Ref AWS::AccountId
          DatabaseName: !Ref GlueDatabaseName
          Name: !Ref GlueTable

