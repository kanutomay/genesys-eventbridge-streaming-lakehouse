# Outputs
# ==========================================
Outputs:
  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt TransformationLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaArn'

  LambdaAliasArn:
    Description: Lambda alias ARN (stable)
    Value: !Ref LambdaAliasStable
    Export:
      Name: !Sub '${AWS::StackName}-LambdaAliasArn'

  FirehoseDeliveryStreamArn:
    Description: Firehose delivery stream ARN
    Value: !GetAtt FirehoseDeliveryStream.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FirehoseArn'

  FirehoseDeliveryStreamName:
    Description: Firehose delivery stream name
    Value: !Ref FirehoseDeliveryStream
    Export:
      Name: !Sub '${AWS::StackName}-FirehoseName'

  DLQArn:
    Description: SQS DLQ ARN
    Value: !GetAtt EventBridgeDLQ.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DLQArn'

  DLQUrl:
    Description: SQS DLQ URL
    Value: !Ref EventBridgeDLQ
    Export:
      Name: !Sub '${AWS::StackName}-DLQUrl'

  GlueTableName:
    Description: Glue table name
    Value: !Ref GlueTable
    Export:
      Name: !Sub '${AWS::StackName}-GlueTable'

  EventBridgeRuleArn:
    Description: "ARN of the EventBridge rule"
    Value: !GetAtt EventBridgeRule.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventBridgeRuleArn"

  EventBridgeRuleName:
    Description: "Name of the EventBridge rule"
    Value: !Ref EventBridgeRule
    Export:
      Name: !Sub "${AWS::StackName}-EventBridgeRuleName"

  EventBridgeFirehoseRoleArn:
    Description: "ARN of the EventBridge to Firehose IAM role"
    Value: !GetAtt EventBridgeFirehoseRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EventBridgeFirehoseRoleArn"

  DataFreshnessMonitorLambdaArn:
    Description: ARN of the data freshness monitoring Lambda
    Value: !GetAtt DataFreshnessMonitorLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FreshnessMonitor'

  SharedAlarmFormatterTopicArn:
    Condition: CreateAlarmFormatter
    Description: Shared alarm formatter SNS topic ARN (use this in other pipeline stacks)
    Value: !Ref AlarmFormatterSNSTopic
    Export:
      Name: !Sub '${Environment}-${OPCOLower}-genesys-shared-alarm-formatter-topic-arn'
